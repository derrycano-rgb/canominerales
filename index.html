<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Canominerales</title>

<meta name="description" content="Venta de hornos de inducción, maquinaria e insumos metalúrgicos en Perú.">
<meta name="keywords" content="hornos de inducción Perú, maquinaria metalúrgica">
<meta name="author" content="Canominerales Group Ltda.">

<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* BASE */
body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #222;
}

/* HEADER */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: #111;
  color: white;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
}

nav a:hover {
  color: #d4af37;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
  background: linear-gradient(135deg, #111, #333);
  color: white;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  margin: 15px 0;
}

.btn-hero {
  background: #d4af37;
  color: black;
  padding: 12px 25px;
  text-decoration: none;
  border-radius: 6px;
}

/* CONTENIDO */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 40px 20px;
}

.section-title {
  text-align: center;
  margin-bottom: 30px;
}

/* TARJETAS */
.cards-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
}

.btn {
  display: block;
  margin-top: 10px;
  padding: 10px;
  background: #25D366;
  color: white;
  text-align: center;
  text-decoration: none;
  border-radius: 5px;
}

</style>
</head>

<body>

<!-- BARRA -->
<div style="background:black; color:white; padding:8px 20px; display:flex; justify-content:space-between;">
  <div>📞 +51 947 136 071</div>
  <div>✉️ canominerales@canominerales.com</div>
</div>

<!-- HEADER -->
<header>
  <div>CANOMINERALES</div>
  <nav>
    <a href="#">Inicio</a>
    <a href="#productos">Productos</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <h1>CANOMINERALES GROUP LTDA</h1>
  <p>MAQUINARIA – INSUMOS – SOLUCIONES METALÚRGICAS</p>
  <a href="#productos" class="btn-hero">Ver Productos</a>
</section>

<!-- PRODUCTOS -->
<section class="container" id="productos">
  <h2 class="section-title">EQUIPOS DE FUNDICIÓN</h2>

  <div class="cards-container">

    <div class="card">
      <img src="horno_1t.jpg">
      <h3>Horno 1 Ton</h3>
      <p>Capacidad: 1000 kg</p>
      <a href="#" class="btn">Cotizar</a>
    </div>

    <div class="card">
      <img src="horno_2t.jpg">
      <h3>Horno 2 Ton</h3>
      <p>Capacidad: 2000 kg</p>
      <a href="#" class="btn">Cotizar</a>
    </div>

  </div>
</section>

</body>
</html>
